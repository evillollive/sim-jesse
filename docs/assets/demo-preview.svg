<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">SimJesse web recreation preview</title>
  <desc id="desc">A stylized preview of the SimJesse classic Mac recreation beside the modern Dream Machine modes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#161625"/>
      <stop offset="0.5" stop-color="#1d1b2f"/>
      <stop offset="1" stop-color="#0c1418"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1020" cy="100" r="220" fill="#a78bfa" opacity="0.12"/>
  <circle cx="130" cy="560" r="260" fill="#06b6d4" opacity="0.1"/>

  <g transform="translate(70 70)">
    <text x="0" y="0" fill="#f0f0f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800">SimJesse!</text>
    <rect x="0" y="22" width="335" height="8" rx="4" fill="url(#rainbow)"/>
    <text x="0" y="64" fill="#c9c9d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">1993 Mac speech toy, revived for the web</text>
  </g>

  <g transform="translate(78 190)" filter="url(#shadow)">
    <rect width="450" height="330" rx="18" fill="#cccccc" stroke="#000" stroke-width="3"/>
    <rect x="0" y="0" width="450" height="25" rx="14" fill="#eeeeee" stroke="#000" stroke-width="2"/>
    <circle cx="22" cy="13" r="7" fill="#cccccc" stroke="#000" stroke-width="2"/>
    <text x="225" y="18" text-anchor="middle" fill="#111" font-family="Geneva, Verdana, sans-serif" font-size="14" font-weight="700">SimJesse! 1.0</text>
    <rect x="0" y="25" width="450" height="23" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="20" y="41" fill="#111" font-family="Geneva, Verdana, sans-serif" font-size="13"></text>
    <text x="58" y="41" fill="#111" font-family="Geneva, Verdana, sans-serif" font-size="13">File</text>
    <text x="112" y="41" fill="#111" font-family="Geneva, Verdana, sans-serif" font-size="13">Edit</text>

    <rect x="42" y="78" width="366" height="78" rx="4" fill="#111" stroke="#000" stroke-width="4"/>
    <rect x="54" y="90" width="342" height="54" fill="#2b2b2b"/>
    <path d="M55 144 L130 104 L190 130 L245 88 L330 144 Z" fill="#5f6f49"/>
    <circle cx="220" cy="116" r="32" fill="#f59e0b" opacity="0.62"/>
    <rect x="57" y="92" width="338" height="50" fill="none" stroke="#39ff7a" stroke-width="1" opacity="0.35"/>
    <text x="225" y="196" text-anchor="middle" fill="#a00000" font-family="Geneva, Verdana, sans-serif" font-size="26" font-weight="800">Run, Jesse, Run!</text>
    <rect x="46" y="226" width="112" height="74" rx="12" fill="#d8d8d8" stroke="#111" stroke-width="2"/>
    <rect x="169" y="226" width="112" height="74" rx="12" fill="#d8d8d8" stroke="#111" stroke-width="2"/>
    <rect x="292" y="226" width="112" height="74" rx="12" fill="#d8d8d8" stroke="#111" stroke-width="2"/>
    <text x="102" y="270" text-anchor="middle" fill="#a00000" font-family="Geneva, Verdana, sans-serif" font-size="15" font-weight="700">Speech</text>
    <text x="225" y="270" text-anchor="middle" fill="#111" font-family="Geneva, Verdana, sans-serif" font-size="15" font-weight="700">Music</text>
    <text x="348" y="270" text-anchor="middle" fill="#111" font-family="Geneva, Verdana, sans-serif" font-size="15" font-weight="700">Nature</text>
  </g>

  <g transform="translate(595 190)" filter="url(#shadow)">
    <rect width="525" height="330" rx="24" fill="#161625" stroke="#3d3d55"/>
    <text x="36" y="56" fill="url(#rainbow)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">The Dream Machine</text>
    <text x="36" y="89" fill="#777790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Classic speech, composition, and remix modes</text>

    <g transform="translate(36 125)">
      <rect width="455" height="58" rx="15" fill="#211b15" stroke="#92400e"/>
      <text x="24" y="36" fill="#f59e0b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Run, Jesse, Run!</text>
      <text x="220" y="36" fill="#777790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">vibes + captions</text>
    </g>
    <g transform="translate(36 198)">
      <rect width="455" height="58" rx="15" fill="#11232a" stroke="#0e7490"/>
      <text x="24" y="36" fill="#06b6d4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Compose</text>
      <text x="145" y="36" fill="#777790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">tap clips, play back, copy a link</text>
    </g>
    <g transform="translate(36 271)">
      <rect width="455" height="58" rx="15" fill="#21182b" stroke="#6d28d9"/>
      <text x="24" y="36" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Remix</text>
      <text x="125" y="36" fill="#777790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Web Audio beats + BPM control</text>
    </g>
  </g>

  <g transform="translate(76 576)">
    <text fill="#c9c9d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">123 original sounds</text>
    <circle cx="205" cy="-6" r="4" fill="#3d3d55"/>
    <text x="228" y="0" fill="#c9c9d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">31 recovered PICT images</text>
    <circle cx="486" cy="-6" r="4" fill="#3d3d55"/>
    <text x="510" y="0" fill="#c9c9d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">7 traced speech patterns</text>
    <circle cx="755" cy="-6" r="4" fill="#3d3d55"/>
    <text x="778" y="0" fill="#c9c9d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">static, no dependencies</text>
  </g>
</svg>
